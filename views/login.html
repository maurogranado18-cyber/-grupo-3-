<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/login.css">
  <title>Iniciar Sesión</title>
</head>
<body>

  <main>
    <section>
  <!-- Logo / Nombre de la marca -->
  <div class="brand-logo">
    <p >NÉBULA</p>
  </div>
    <section>
      <h1>Iniciar Sesión</h1>

      <form action="/index.html" >
        
        <!-- Campo para Email o Usuario -->
        <div>
          <label for="email">Correo electrónico:</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="ejemplo@correo.com" 
            required
          >
        </div>

        <!-- Campo para Contraseña -->
        <div>
          <label for="password">Contraseña:</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Mínimo 8 caracteres" 
            minlength="8" 
            maxlength="20"
            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':&quot;\\|,.&lt;&gt;/?]).{8,20}$"
            title="Debe incluir al menos 8 caracteres, una mayúscula, una minúscula, un número y un carácter especial."
            required
          >
        </div>

        <!-- Opción Recordarme -->
        <div>
          <label>
            <input type="checkbox" name="remember"> Recordarme
          </label>
        </div>

        <!-- Botón de envío -->
        <button type="submit" action=>Ingresar</button>
    

      </form>

      <!-- Enlaces secundarios -->
      <div>
        <p><a href="#">¿Olvidaste tu contraseña?</a></p>
        <p>¿No tienes cuenta? <a href="/views/register.html">Regístrate aquí</a></p>
      </div>
    </section>
  </main>

</body>
</html>
