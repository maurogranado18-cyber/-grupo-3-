<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - Streaming App</title>
    <link rel="stylesheet" href="/css/contacto.css" />
  </head>
  <body class="contact-body">
    <!-- Sección Principal de Contacto -->
    <section class="contact-section">
      <!-- Cabecera de la sección -->
      <div class="contact-header">
        <h1 class="contact-title">Contactate con nosotros</h1>
        <p class="contact-subtitle">
          ¿Tenés dudas sobre tu cuenta, contenido o sugerencias? Escribinos.
        </p>
      </div>

      <!-- Contenedor general en dos columnas -->
      <div class="contact-container">
        <!-- Columna 1: Formulario -->
        <div class="contact-form-wrapper">
          <h2 class="contact-form-heading">Envianos un mensaje</h2>
          <form class="contact-form">
            <div class="contact-form-group">
              <label for="nombre" class="contact-form-label">Nombre y Apellido</label>
              <input
                type="text"
                id="nombre"
                name="nombre"
                class="contact-form-input"
                placeholder="nombre completo "
                required
              />
            </div>

            <div class="contact-form-group">
              <label for="email" class="contact-form-label">Correo Electrónico</label>
              <input
                type="email"
                id="email"
                name="email"
                class="contact-form-input"
                placeholder="correo@ejemplo.com"
                required
              />
            </div>

            <div class="contact-form-group">
              <label for="asunto" class="contact-form-label">Asunto</label>
              <input
                type="text"
                id="asunto"
                name="asunto"
                class="contact-form-input"
                placeholder="Motivo de tu consulta"
              />
            </div>

            <div class="contact-form-group">
              <label for="mensaje" class="contact-form-label">Mensaje</label>
              <textarea
                id="mensaje"
                name="mensaje"
                rows="5"
                class="contact-form-textarea"
                placeholder="Escribí tu mensaje acá..."
                required
              ></textarea>
            </div>

            <button type="submit" class="contact-btn-submit">Enviar Mensaje</button>
          </form>
        </div>

        <!-- Columna 2: Información de Ubicación y Datos -->
        <div class="contact-info-wrapper">
          <h2 class="contact-info-heading">Información y Ubicación</h2>

          <div class="contact-info-item">
            <span class="contact-info-icon">📍</span>
            <div>
              <h3 class="contact-info-title">Dirección</h3>
              <p class="contact-info-text">Av. siempre viva 123</p>
            </div>
          </div>

          <div class="contact-info-item">
            <span class="contact-info-icon">📞</span>
            <div>
              <h3 class="contact-info-title">Teléfono / WhatsApp</h3>
              <p class="contact-info-text">+54 911 123-4567</p>
            </div>
          </div>

          <div class="contact-info-item">
            <span class="contact-info-icon">✉️</span>
            <div>
              <h3 class="contact-info-title">Correo</h3>
              <p class="contact-info-text">soporte@nebula.com</p>
            </div>
          </div>

          <!-- Contenedor del Mapa -->
          <div class="contact-map-container">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3284.0183711532504!2d-58.38417972452465!3d-34.603696957496645!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4aa9f0a6da5edb%3A0x11bead4e234e558b!2sObelisco!5e0!3m2!1ses!2sar!4v1791935205031!5m2!1ses!2sar"
              style="border: 0"
              allowfullscreen=""
              loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
