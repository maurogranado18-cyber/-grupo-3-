<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/register.css" />
    <title>Registro - NÉBULA</title>
  </head>

  <body>
    <main>
      <section id="Formulario-registro-usuario">
        <!-- Marca NÉBULA -->
        <div class="brand-logo">
          <a href="index.html">NÉBULA</a>
        </div>

        <header>
          <h1>Crear cuenta</h1>
          <p>Completa el formulario para registrarte en la plataforma</p>
        </header>

        <form action="/views/login.html">
          <article>
            <div>
              <label for="Nombre">Nombre de usuario</label>
              <input
                type="text"
                id="Nombre"
                name="Nombre"
                required
                placeholder="Tu usuario"
                minlength="4"
                maxlength="10"
              />
            </div>

            <div>
              <label for="contraseña">Contraseña</label>
              <input
                type="password"
                id="contraseña"
                name="contraseña"
                required
                placeholder="Mín 8 caracteres, 1 mayúscula, 1 número"
                minlength="8"
                maxlength="15"
                pattern="^(?=.*[A-Z])(?=.*\d).{8,15}$"
                title="La contraseña debe tener entre 8 y 15 caracteres, e incluir al menos una letra mayúscula y un número."
              />
            </div>

            <div>
              <label for="email">Correo electrónico</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="ejemplo@correo.com"
                required
              />
            </div>
          </article>

          <article>
            <div>
              <label for="provincia">Provincia</label>
              <select name="provincia" id="provincia" required>
                <option value="" selected disabled>
                  Selecciona tu provincia
                </option>
                <option value="Buenos Aires">Buenos Aires</option>
                <option value="Catamarca">Catamarca</option>
                <!-- Más provincias... -->
              </select>
            </div>
          </article>

          <button type="submit">Registrarse</button>
        </form>

        <div class="secondary-links">
          <p>
            ¿Ya tienes una cuenta?
            <a href="/views/login.html">Inicia sesión aquí</a>
          </p>
        </div>
      </section>
    </main>

    <footer>
      <small>© 2026 NÉBULA. Todos los derechos reservados.</small>
    </footer>
  </body>
</html>
