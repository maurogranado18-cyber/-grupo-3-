<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - NÉBULA</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

    <!-- Estilos locales -->
    <link rel="stylesheet" href="../CSS/variable.css">
    <link rel="stylesheet" href="../CSS/header.css">
    <link rel="stylesheet" href="../CSS/footer.css">
</head>
<body class="bg-dark text-light d-flex flex-column min-vh-100">

    <!-- NAVBAR NÉBULA -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black py-2 border-bottom border-secondary border-opacity-25">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold fs-3 text-uppercase me-4" href="../index.html" style="color: var(--accent-nebula, #8C52FF);">
                NÉBULA
            </a>
        </div>
    </nav>

    <!-- FORMULARIO LOGIN DE NÉBULA -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card bg-black border border-secondary border-opacity-25 p-4 rounded-3 text-light shadow-lg">
                    <h3 class="fw-bold text-center mb-4 text-uppercase" style="color: var(--accent-nebula, #8C52FF);">Iniciar Sesión</h3>
                    
                    <!-- Al enviar el formulario o hacer clic en ingresar, redirige a error404.html -->
                    <form action="error404.html" method="GET">
                        <div class="mb-3">
                            <label for="emailInput" class="form-label small fw-semibold">Correo electrónico</label>
                            <input type="email" class="form-control bg-dark text-light border-secondary" id="emailInput" placeholder="usuario@nebula.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="passwordInput" class="form-label small fw-semibold">Contraseña</label>
                            <input type="password" class="form-control bg-dark text-light border-secondary" id="passwordInput" placeholder="••••••••" required>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input bg-dark border-secondary" type="checkbox" id="rememberMe">
                                <label class="form-check-label small text-secondary" for="rememberMe">Recordarme</label>
                            </div>
                            <a href="error404.html" class="small text-decoration-none" style="color: var(--accent-nebula, #8C52FF);">¿Olvidaste tu clave?</a>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="background-color: var(--primary-nebula, #8C52FF); border: none;">
                            Ingresar
                        </button>
                    </form>

                    <hr class="border-secondary opacity-25 my-4">

                    <div class="text-center">
                        <span class="small text-secondary">¿No tenés cuenta? </span>
                        <a href="registro.html" class="small fw-semibold text-decoration-none" style="color: var(--accent-nebula, #8C52FF);">Registrate acá</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-black text-secondary py-3 border-top border-secondary border-opacity-25 mt-auto">
        <div class="container text-center">
            <p class="mb-0 small">&copy; 2026 NÉBULA</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
